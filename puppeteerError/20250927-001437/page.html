		$(document).ready(

					loadDialogBox();

					tabElement = $('#center-tab').omTabs({
						height : "fit",
						closable : false,
						tabMenu : true,
						active : 0,
						onClose : function(n, event) {

							if (total <= 0) {

					loadTree();

		//初始化第一个页签
		function initDefaultFrame() {
			/** 关闭所有页签以后不能重新打开bug  add by qingfeng_li 2014-1-2**/
			var idx = Math.round(Math.random() * 10000);
			var tab = document.getElementById('center-tab');
			var divs = tab.getElementsByTagName("div");
			/** 追加首页frame（匹配div的innerHTML） **/
			divs[1].innerHTML = '<div class="om-widget om-panel"><div class="om-panel-body om-widget-content om-panel-noheader om-state-nobd" id="tab1" style="overflow: hidden;">'
					+ '<iframe style="height: 598px;" id="main" border="0" src="'
					+ fmainUrl
					+ '" frameborder="no" width="100%"></iframe></div></div>';

			tabElement
					.omTabs(
							'add',
							{
								title : '主页',
								tabId : 'tab_main',
								content : "<iframe id='"
										+ idx
										+ "' border=0 frameBorder='no' name='inner-frame' src='"
										+ fmainUrl + "' height='" + ifh
										+ "' width='100%'></iframe>",
								closable : true
							});
			$('#center-tab').omTabs({});
		}
		function loadTree() {
			$("#myTree")
					.omTree(
							{
								dataSource : 'findCacheMenu.action',
								simpleDataModel : true,
								onSelect : function(nodeData) {
									if (nodeData.furl == "") {
										if ($("#" + nodeData.nid).attr("class")
												.indexOf("collapsable") >= 0) {
											if ($("#" + nodeData.nid + ">span")
													.attr("class").indexOf(
															"FirstLayer") >= 0) {
												$("#" + nodeData.nid + ">span")
														.css("background",
																"url(../css/default/images/tree/Item1_BG.png) no-repeat");
											} else {
												$("#" + nodeData.nid + ">span")
														.css("background",
																"url(../css/default/images/tree/Item2_BG.jpg) no-repeat");
											}

											$('#myTree').omTree('collapse',
													nodeData);

										} else if ($("#" + nodeData.nid).attr(
												"class").indexOf("expandable") >= 0) {
											if ($("#" + nodeData.nid + ">span")
													.attr("class").indexOf(
															"FirstLayer") >= 0) {
												$("#" + nodeData.nid + ">span")
														.css("background",
																"url(../css/default/images/tree/Item1_BG_Select.png) no-repeat");
											} else {
												$("#" + nodeData.nid + ">span")
														.css("background",
																"url(../css/default/images/tree/Item2_BG_Select.jpg) no-repeat");
											}

											$('#myTree').omTree('expand',
													nodeData);
										}
									}
								},
								onClick : showLink,
								onDblClick : function(nodeData, event) {
									return;
								},
								onSuccess : function(data, testStatus,
										XMLHttpRequest, event) {
									$("#myTree")
											.find(".listIcon")
											.each(
													function(index, domEle) {
														if ($(domEle)
																.attr("class")
																.indexOf(
																		'ui-icon-') >= 0) {
															var iconName = $(
																	domEle)
																	.attr(
																			"class")
																	.split(' ');
															for ( var i = 0; i < iconName.length; i++) {
																if (iconName[i]
																		.indexOf("ui-icon-") >= 0) {
																	$(domEle)
																			.prepend(
																					"<span class='ui-icon " + iconName[i] + "'></span>");
																	$(domEle)
																			.removeClass(
																					"ui-icon "
																							+ iconName[i]);
																	break;
																}
															}
														}
													});
								}
							});

		};

		var menuManage = {
			id : 10000,
			text : "菜单管理",
			fisleaf : 1,
			furl : 'menumanage.jsp'
		};
		function showLink(nodeData, event) {
			if (nodeData == null) {
				nodeData = menuManage;
			}
			if (nodeData.fisleaf == '1') {
				//如果页签已打开则激活页签，否则新增页签
				var tabId = tabElement.omTabs('getAlter', 'tab_' + nodeData.id);
				if (tabId) {
					tabElement.omTabs('activate', tabId);
				} else {
					if (nodeData.furl != null && nodeData.furl != "") {
						var url = nodeData.furl;
						if (nodeData.furl.indexOf("?") == -1) {
							url += "?";
						} else {
							url += "&";
						}
						url += "title=" + escape(nodeData.text) + "&menuid="
								+ escape(nodeData.fid);//新增界面别名参数，以便在界面显示  add by qingfeng_li 2013-12-25
						//var idx = Math.round(Math.random()*10000);
						tabElement
								.omTabs(
										'add',
										{
											title : nodeData.text,
											tabId : 'tab_' + nodeData.id,
											//tabId : idx,
											content : "<iframe id='"
													+ nodeData.id
													+ "' border=0 frameBorder='no' name='inner-frame' src='"
													+ url
													+ "' height='"
													+ ifh
													+ "' width='100%'></iframe>",
											closable : true
										});
					}
				}
			} else {
				if (nodeData.expanded) {
					$('#myTree').omTree('collapse', nodeData);
					nodeData.expanded = false;
				} else {
					$('#myTree').omTree('expand', nodeData);
					nodeData.expanded = true;
				}
			}
		};
		function loadMain() {
			$
					.ajax({
						type : 'POST',
						url : 'getMainUrl',
						dataType : 'json',
						contentType : 'application/x-www-form-urlencoded; charset=utf-8',
						success : function(request) {
							fmainUrl = request.fmainUrl;
							if (!!fmainUrl) {
								var mainIf = document.getElementById("main");
								mainIf.src = fmainUrl;
							} else {
								alert("主页加载失败");
							}
						}
					});
		}
		//打开修改密码界面
		function openUpdatePassword() {
			openNewTabByName("密码修改", "../admin/system/updateUserPassword.jsp",
					'password');
		}

		//修改个人信息
		function openUserinfo() {
			sendAjaxReq("post", "getCurUserInfo", "", function(request) {
				var jsonstr = request.responseText;
				var json = eval('(' + jsonstr + ')');
				var url = "system/userDialog.jsp";
				url += "?fid=" + json['fid'] + "&recordJsonStr="
						+ escape(jsonstr) + "&type=1";
				openNewTabByName("个人信息", url, 'userinfo');
				//openDialogBox(url);
			}, null, null, null);
		}

		function openHelp() {
			var url = "../baseinfo/Help.jsp";
			openNewTabByName("帮助", url, 'help');
		}

		//打开消息界面
		function openSys() {
			blinkBool = true;
			var ftask = $("#ftask").val();
			var fmsg = $("#fmsg").val();
			openNewTabByName("消息中心", "../jbpm/messageCenter.jsp?ftaskMsg="
					+ ftask + "&fmsg=" + fmsg, 'message');
		}
		//打开主页
		function openMain() {
			openNewTabByName("主页", fmainUrl, 'main');
		}
		function getMessageInfo() {
			$
					.ajax({
						type : 'POST',
						url : 'getMessage',
						async : false,
						dataType : 'json',
						contentType : 'application/x-www-form-urlencoded; charset=utf-8',
						success : function(request) {
							var total = request.fsum;
							if (!!total) {
								var message = $("#fmessage").html(
										"消息(" + total + ")");
								$("#fmessage").val(total);
							}
							var ftask = request.ftask;
							var fmsg = request.fmsg;
							$("#ftask").val(ftask);
							$("#fmsg").val(fmsg);
						}
					});
		}
		//消息闪烁
		function Setlinkblink() {
			var message = document.getElementById('fmessage');
			var val = message.value;
			if (val != 0 && blinkBool == false) {
				if (!message.style.color) {
					message.style.color = "white"
				}
				if (message.style.color == "red") {
					message.style.color = "white"
				} else {
					message.style.color = "red"
				}
				setTimeout("Setlinkblink()", 800);
			}
		}
		//展开/隐藏菜单
		function openMenuPanel() {
			if (!menuFlag) {
				$('body').omBorderLayout('expandRegion', 'west');//设置panel展开
				menuFlag = true;
			} else {
				$('body').omBorderLayout('collapseRegion', 'west');//设置panel隐藏
				menuFlag = false;
			}
		}
	</script>
